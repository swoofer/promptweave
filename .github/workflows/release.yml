name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_only:
        description: "Skip release-please and just publish to npm from main HEAD"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `publish_only` exists because release-please only reports
      # `release_created` on the run that actually cuts the release. If that run
      # publishes a tag but fails at `npm publish` — an expired NPM_TOKEN, a
      # registry hiccup — every later run sees the release as already cut and
      # skips publishing, so the version stays permanently missing from npm with
      # no way to retry. That happened to 0.4.0.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: ${{ github.event_name == 'push' || inputs.publish_only != 'true' }}
        with:
          release-type: node
          # Pinned explicitly so the release target always matches this
          # workflow's `push: branches: [main]` trigger, instead of relying
          # implicitly on the repository's default-branch setting.
          target-branch: main

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release.outputs.release_created || inputs.publish_only == 'true' }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ steps.release.outputs.release_created || inputs.publish_only == 'true' }}
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - run: npm ci
        if: ${{ steps.release.outputs.release_created || inputs.publish_only == 'true' }}

      - run: npm run build
        if: ${{ steps.release.outputs.release_created || inputs.publish_only == 'true' }}

      - run: npm publish
        if: ${{ steps.release.outputs.release_created || inputs.publish_only == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
